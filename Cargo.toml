[package]
name = "tokio-memory"
version = "0.2.2"
edition = "2021"
rust-version = "1.79"
description = "Do not start agent memory with a database. Trait-based agent memory: episodic, semantic and working stores with an in-memory implementation and a durable SQLite store with full-text search, decay and consolidation."
readme = "README.md"
keywords = ["memory", "agents", "sqlite", "tokio", "llm"]
categories = ["asynchronous", "memory-management", "database"]
license = "MIT"
repository = "https://github.com/Mattbusel/tokio-memory"
documentation = "https://docs.rs/tokio-memory"

[dependencies]
# tokio: async runtime — core dependency
tokio = { version = "1.40", features = ["full"] }

# serde: serialization framework — needed for snapshot persistence and Episode/Fact derives
serde = { version = "1", features = ["derive"] }

# serde_json: JSON support — used in tests and potential external interchange
serde_json = "1"

# uuid: unique IDs for MemoryId, AgentId, SessionId, etc.
uuid = { version = "1", features = ["v4", "serde"] }

# chrono: timestamps on Episode and Fact records
chrono = { version = "0.4", features = ["serde"] }

# dashmap: concurrent hash map — backing store for InMemoryEpisodicStore / SemanticStore
dashmap = "6"

# postcard: compact binary codec replacing unmaintained bincode
postcard = { version = "1", features = ["alloc"] }

# thiserror: zero-cost error derive — replaces manual Display impls
thiserror = "1"
async-trait = "0.1.89"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[dev-dependencies]
# proptest: property-based testing — required for algorithmic correctness guarantees
proptest = "1"
tempfile = "3.27.0"

# tokio test utilities
tokio = { version = "1.40", features = ["full", "test-util"] }

[lints.rust]

[features]
# Durable SQLite backend with full-text search (SQLite is compiled in).
sqlite = ["dep:rusqlite"]
# Enforce zero-panic policy in production paths
# (clippy lints configured via clippy.toml or inline attributes)

[[test]]
name = "sqlite_store"
required-features = ["sqlite"]

[package.metadata.docs.rs]
all-features = true
