# Tests on every push to the default branch, merge request, or manual run.
# The crate is a library, so there is nothing to build for releases.

stages: [test]

test:
  stage: test
  image: rust:1-bookworm
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["src/**/*", "tests/**/*", "examples/**/*", "benches/**/*", "Cargo.toml", "Cargo.lock", ".gitlab-ci.yml"]
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
    CARGO_TARGET_DIR: "${CI_PROJECT_DIR}/target"
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
    CARGO_INCREMENTAL: "0"
  cache:
    key: cargo-test
    paths: [target/, .cargo-home/]
  script:
    - cargo test --locked --all-features

